<!doctype html>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  DEVAKALA DEMO — 9:16, 8.0s @ 120 BPM, 24fps.
//  Era 1 (cosmic night): Shesha's dream — reclining figure, lotus rising.
//  Era 2 (parchment day): the garden — halo, bloomed lotus, foliage.
//  Bridge: the cosmic disc (top of era 1) → the golden halo (era 2).
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 8.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Palatino Linotype", "Palatino", "Book Antiqua", "Georgia", serif';   // classical serif — Windows, macOS, Linux
const CX = 540;

// eras: [t0, t1, scene function]
const ERA_LIST = [[0, 4, () => sceneCosmic()], [4, 8, () => sceneGarden()]];
const SHOTS = [
  ['cosmic',  0,  0.0, 4.0, 'Shesha\'s dream — the lotus rises'],
  ['garden',  1,  4.0, 8.0, 'the cosmic disc opens into the halo; the garden blooms'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [4.0],
  cues: { lotusRise: 1.2, bloom: 4.8 },
  acts: [
    { name: '1 Cosmic night', role: 'build',   t0: 0.0, t1: 4.0 },
    { name: '2 Garden',       role: 'gift',    t0: 4.0, t1: 8.0 },
  ],
  board: [
    { t: 2.0,  title: 'the reclining figure, lotus stem rising', sound: 'deep pad, a slow fifth', next: 'the cosmic disc closes in' },
    { t: 6.0,  title: 'the halo opens, lotus blooms', sound: 'bright chord, pluck cascade', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
// =====================================================================
//  kit/core.js — seeded RNG, math, easing, palette, geometry, the hand-drawn drawing kit
//  (wobble on the boil, ink, paint, hatch, pencil, stipple, grain), cameras, mono text.
//  Needs from the piece head: FPS, W, H. Render state: ctx, F (frame), B (boil = floor(F/2)).
// =====================================================================

// ---------------------------------------------------------------------
//  seeded RNG
// ---------------------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

function RNG(...xs) {

    f,

    n: (amt) => (f() * 2 - 1) * amt,
    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],

}

// ---------------------------------------------------------------------
//  math
// ---------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
// has absolute time t reached cut time c? (cuts snap to the nearest frame, like shot boundaries)
const past = (t, c) => Math.round(t * FPS + 1e-6) >= Math.round(c * FPS);
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const EZ = {
  o2: (t) => 1 - (1 - clamp(t)) ** 2,
  o3: (t) => 1 - (1 - clamp(t)) ** 3,
  i2: (t) => clamp(t) ** 2,
  i3: (t) => clamp(t) ** 3,
  io: (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; },

// ---------------------------------------------------------------------
//  render state
// ---------------------------------------------------------------------
let ctx = null;   // current 2d context
let F = 0;        // absolute frame index
let B = 0;        // boil index — reseeds every 2 frames (Math.floor(t*12))

const C = {
  ink: '#3a2417', cream: '#efe5cf', paper: '#f4ecd9', paperLine: 'rgba(90,130,190,0.32)',
  orange: '#e58a4e', orangeD: '#c3622e', orangeL: '#f4b27c', terra: '#d97757',
  rose: '#d98b8b', roseD: '#b0616a', roseL: '#efb9b0',
  wood: '#d6a466', woodD: '#a8773f', woodL: '#e9c48f',
  sky: '#9cc4d6', skyD: '#6f9fb8', skyL: '#c9e1ea',
  teal: '#3d9f96', tealL: '#86c9be',
  yellow: '#f0c55a', yellowL: '#f7dd92',
  green: '#5f9c5c', greenL: '#a3cf92',
  red: '#d4382c', redL: '#ea7a6c',
  skin: '#ebb68f', skinD: '#c7815d', skinL: '#f7d4b4',
  lav: 'rgba(104,112,214,0.7)', lavS: 'rgba(104,112,214,0.42)',
  navy: '#0c0d1c', navy2: '#15173a', peri: '#c8d0f0', periD: '#7c86c4', periS: 'rgba(150,164,230,0.20)',
  cyan: '#52d6c4', mag: '#e0368f', glow: '#5de37a', white: '#f4f6ff',
};
const RAINBOW = ['#f0d042', '#e050b8', '#46cde0', '#7ad866', '#a47ef0'];
const MONO = 'Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", "Courier New", monospace';   // Windows first, then macOS / Linux

// ---------------------------------------------------------------------
//  geometry
// ---------------------------------------------------------------------
function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot), full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (full ? n : n - 1);
    const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}
function rrectPts(x, y, w, h, r, n = 6) {
  r = Math.min(r, w / 2, h / 2);
  const P = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];

  return P;
}
function arcPts(cx, cy, r, a0, a1, n = 18, sy = 1) {
  const P = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
  return P;
}
function xform(P, tx, ty, rot = 0, sx = 1, sy = sx) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return P.map(([x, y]) => [tx + x * sx * c - y * sy * s, ty + x * sx * s + y * sy * c]);
}
function bbox(P, pad = 0) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of P) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }

}
function resample(P, closed, step) {
  const out = [], n = P.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const a = P[i], b = P[(i + 1) % n], k = Math.max(1, Math.ceil(dist(a, b) / step));
    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
  }

  return out;
}
function pathLen(P) { let L = 0; for (let i = 1; i < P.length; i++) L += dist(P[i - 1], P[i]); return L; }

  let want = pathLen(P) * clamp(frac);
  const out = [P[0]];
  for (let i = 1; i < P.length; i++) {
    const d = dist(P[i - 1], P[i]);
    if (want >= d) { out.push(P[i]); want -= d; }
    else { const k = want / (d || 1); out.push([lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)]); break; }

}
function pointAt(P, frac) { const S = subPath(P, frac); return S[S.length - 1]; }

// ---------------------------------------------------------------------
//  drawing kit — boil, sketchy lines, hatching, stipple, pencil, grain
// ---------------------------------------------------------------------
// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {
  const Q = resample(P, closed, step), n = Q.length;
  const R = RNG('wob', key, B);
  const f1 = R.r(0.012, 0.03), f2 = R.r(0.05, 0.1), p1 = R.r(0, TAU), p2 = R.r(0, TAU);
  const sx = R.n(amt * 0.5), sy = R.n(amt * 0.5);
  const out = new Array(n); let s = 0;
  for (let i = 0; i < n; i++) {
    const a = Q[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = Q[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
    if (i) s += dist(Q[i - 1], Q[i]);
    const o = amt * (0.75 * Math.sin(s * f1 + p1) + 0.35 * Math.sin(s * f2 + p2));
    out[i] = [Q[i][0] + nx / l * o + sx, Q[i][1] + ny / l * o + sy];
  }

}
function trace(P, closed) {
  ctx.beginPath();
  const n = P.length; if (n < 2) return;
  if (closed) {
    ctx.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  } else {
    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = P[i], q = P[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.lineTo(P[n - 1][0], P[n - 1][1]);
  }

// sketchy stroke. o: closed, color, w, amt, key, alpha, frac (write-on), double
function ink(P, o = {}) {
  const closed = !!o.closed, key = o.key ?? 'ink';
  let Q = o.raw ? P : wobble(P, closed, o.amt ?? 1.8, key);
  let cl = closed;
  if (o.frac != null && o.frac < 1) { if (o.frac <= 0) return Q; Q = subPath(closed ? [...Q, Q[0]] : Q, o.frac); cl = false; }
  ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = o.alpha ?? 1;
  trace(Q, cl); ctx.stroke();

    let Q2 = wobble(P, closed, (o.amt ?? 1.8) * 1.6 + 0.8, key + '~');
    if (!cl && closed) Q2 = subPath([...Q2, Q2[0]], o.frac ?? 1);
    ctx.lineWidth = (o.w ?? 3) * 0.4; ctx.globalAlpha = (o.alpha ?? 1) * 0.55; trace(Q2, cl); ctx.stroke();

}

function paint(P, o = {}) {
  const key = o.key || 'paint';
  const Q = o.raw ? P : wobble(P, true, o.amt ?? 1.6, key);
  ctx.save();
  trace(Q, true);
  if (o.fill) { ctx.globalAlpha = o.fillAl ?? 1; ctx.fillStyle = o.fill; ctx.fill(); ctx.globalAlpha = 1; }
  if (o.tex) { ctx.clip(); const bb = bbox(Q, 6); o.tex.forEach((t, i) => texture(bb, { key: key + ':' + i, ...t })); }
  ctx.restore();
  if (o.line !== false) {
    ctx.strokeStyle = o.line || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = o.lineAl ?? 1; trace(Q, true); ctx.stroke(); ctx.globalAlpha = 1;
  }

}
function texture(bb, t) {
  if (t.k === 'hatch') hatch(bb, t);
  else if (t.k === 'cross') { hatch(bb, t); hatch(bb, { ...t, a: (t.a ?? 0.7) + (t.a2 ?? 1.25), key: t.key + 'x' }); }

}
// parallel hatching inside current clip. t: a angle, gap, c, w, al, dash [min,max], skip, dens(x,y)
function hatch(bb, t) {
  const a = t.a ?? 0.7, gap = t.gap ?? 7, S = RNG('hs', t.key), R = RNG('hj', t.key, B);
  const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2, rad = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 + 4;
  const ca = Math.cos(a), sa = Math.sin(a), dens = t.dens, jit = t.jit ?? 0.9, dash = t.dash;
  ctx.beginPath();

    const dd = d + S.n(gap * 0.3);
    let u = -rad + (dash ? S.r(0, dash[1]) : 0);
    while (u < rad) {
      const len = dash ? S.r(dash[0], dash[1]) : rad * 2, u2 = Math.min(rad, u + len);
      const mu = (u + u2) / 2, mx = cx + ca * mu - sa * dd, my = cy + sa * mu + ca * dd, p = S.f();
      if (!dens || p < dens(mx, my)) {
        const e1 = R.n(jit), e2 = R.n(jit);
        ctx.moveTo(cx + ca * u - sa * (dd + e1), cy + sa * u + ca * (dd + e1));
        ctx.lineTo(cx + ca * u2 - sa * (dd + e2), cy + sa * u2 + ca * (dd + e2));

}
// colored-pencil diagonal strokes
function pencil(bb, t) {
  const S = RNG('ps', t.key), R = RNG('pj', t.key, B);

  const n = Math.min(t.max ?? 6000, t.n ?? Math.floor(area / (t.per ?? 700)));
  const a = t.a ?? -0.95, L = t.len ?? 14, dens = t.dens;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = S.r(bb.x0, bb.x1), y = S.r(bb.y0, bb.y1), p = S.f(), aa = a + S.n(0.22), l = L * (0.5 + S.f() * 0.7);

    const jx = R.n(1.1), jy = R.n(1.1), dx = Math.cos(aa) * l / 2, dy = Math.sin(aa) * l / 2;
    ctx.moveTo(x - dx + jx, y - dy + jy); ctx.lineTo(x + dx + jx, y + dy + jy);
  }
  ctx.strokeStyle = t.c; ctx.lineWidth = t.w ?? 1.4; ctx.globalAlpha = t.al ?? 0.45; ctx.lineCap = 'round';
  ctx.stroke(); ctx.globalAlpha = 1;
}
// square stipple dots
function stipple(bb, t) {
  const S = RNG('ss', t.key), R = RNG('sj', t.key, B);
  const n = t.n ?? 400, sz = t.s ?? 2.2, dens = t.dens, jit = t.jit ?? 0.8;
  ctx.fillStyle = t.c; ctx.globalAlpha = t.al ?? 1; ctx.beginPath();

    const x = S.r(bb.x0, bb.x1), y = S.r(bb.y0, bb.y1), p = S.f(), s = sz * (0.6 + S.f() * 0.8);

// screen-space paper grain, reseeded with the boil
function grain(o = {}) {
  ctx.save(); screen();
  const R = RNG('grain', B), n = o.n ?? 2600;
  ctx.fillStyle = o.dark || 'rgba(70,45,25,0.13)'; ctx.beginPath();
  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.7, 1.7);
  ctx.fill();

  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.9, 1.9);
  ctx.fill();

  ctx.strokeStyle = 'rgba(80,55,35,0.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 90; i++) { const x = R.r(0, W), y = R.r(0, H), a = R.r(0, TAU), l = R.r(6, 22); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); }

// ---------------------------------------------------------------------
//  construction lines, rulers, sparks, bursts, rainbow contours
// ---------------------------------------------------------------------
function construct(cx, cy, r, o = {}) {
  const R = RNG('con', o.key ?? 'c', B);

function cline(x1, y1, x2, y2, o = {}) {

function ruler(x1, y1, x2, y2, o = {}) {

  ctx.save(); ctx.strokeStyle = o.c || C.periD; ctx.lineWidth = o.w ?? 1.5; ctx.globalAlpha = o.al ?? 1; ctx.lineCap = 'round';

function sparkBurst(cx, cy, r, o = {}) {

  ctx.restore();

  // Stamen dots
  const Rs = RNG('lot', key);
  ctx.fillStyle = DK.goldD;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU, dr = r * Rs.r(0.04, 0.14);
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * dr, y + Math.sin(a) * dr, 4, 0, TAU); ctx.fill();
  }
}

// =====================================================================
//  Halo — ornate gold mandorla with outer petal crown and shadow glow
// =====================================================================
function dkHalo(x, y, r, key) {
  key = key ?? 'halo';

  // Outermost lotus petal ring (8 petal points radiating outward)
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU;
    const tpX = x + Math.cos(a) * r * 1.38, tpY = y + Math.sin(a) * r * 1.38;
    const bsX = x + Math.cos(a) * r * 0.90, bsY = y + Math.sin(a) * r * 0.90;
    dkPetalGrad(tpX, tpY, bsX, bsY, r * 0.22, DK.goldL, DK.gold, key + 'lp' + i, 0.14);
  }
  // Alternating small petals
  for (let i = 0; i < 8; i++) {
    const a = ((i + 0.5) / 8) * TAU;
    const tpX = x + Math.cos(a) * r * 1.18, tpY = y + Math.sin(a) * r * 1.18;
    const bsX = x + Math.cos(a) * r * 0.88, bsY = y + Math.sin(a) * r * 0.88;
    dkShape(petalPts(tpX, tpY, bsX, bsY, r * 0.13, 16), DK.gold, { key: key + 'lps' + i, w: 2, line: DK.goldD, amt: 0.12 });
  }

  // Outer ring with glow
  ctx.save();
  ctx.shadowColor = 'rgba(240,180,40,0.50)';
  ctx.shadowBlur = 45;
  dkShape(ellipsePts(x, y, r, r, 0, 56), DK.gold, { key: key + 'o', amt: 0.12, w: 6, line: DK.goldD });
  ctx.restore();

  dkShape(ellipsePts(x, y, r * 0.84, r * 0.84, 0, 56), DK.goldL, { key: key + 'i', amt: 0.07, line: false });

  // Outer dot ring — large-small-small-red pattern
  for (let i = 0; i < 36; i++) {
    const a = (i / 36) * TAU;
    const isRed = i % 9 === 0, isBig = i % 3 === 0;
    ctx.fillStyle = isRed ? DK.red : (isBig ? DK.goldD : DK.gold);
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * r * 0.93, y + Math.sin(a) * r * 0.93,
      isRed ? 7 : (isBig ? 5 : 3.5), 0, TAU);
    ctx.fill();
  }

  // Middle dot ring
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * TAU;
    ctx.fillStyle = i % 5 === 0 ? DK.red : DK.goldD;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * r * 0.73, y + Math.sin(a) * r * 0.73,
      i % 5 === 0 ? 5 : 3, 0, TAU);
    ctx.fill();
  }

  // Radial spokes (16)
  ctx.strokeStyle = DK.goldD; ctx.lineWidth = 1.8;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * TAU;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r * 0.20, y + Math.sin(a) * r * 0.20);
    ctx.lineTo(x + Math.cos(a) * r * 0.66, y + Math.sin(a) * r * 0.66);
    ctx.stroke();
  }

  // Inner centre disc
  dkShape(ellipsePts(x, y, r * 0.18, r * 0.18, 0, 28), DK.goldL, { key: key + 'c', amt: 0.06, w: 2, line: DK.goldD });
}

// =====================================================================
//  Kerala spiral coil — smooth logarithmic spiral
// =====================================================================
function dkCoil(x, y, r, key) {
  key = key ?? 'coil';
  const P = [], nPts = 70, turns = 2.5;
  for (let i = 0; i <= nPts; i++) {
    const t = i / nPts, a = t * TAU * turns - Math.PI / 2;
    P.push([x + Math.cos(a) * r * (0.05 + 0.95 * t),
            y + Math.sin(a) * r * (0.05 + 0.95 * t)]);
  }
  ink(P, { w: Math.max(3.5, r * 0.08), color: DK.green, key, amt: 0.45 });
  dkShape(petalPts(x + r * 0.1, y - r * 0.95, x, y - r * 0.52, r * 0.22, 16),
    DK.greenL, { key: key + 'lf', w: 2.5, amt: 0.35 });
}

// =====================================================================
//  Scroll cloud — three rounded lobes
// =====================================================================
function dkCloud(x, y, s, key) {
  key = key ?? 'cld';
  dkShape(ellipsePts(x, y, s * 0.85, s * 0.38, 0, 32), DK.ivory, { key: key + 'b', amt: 0.32, w: 2.5 });
  dkShape(ellipsePts(x - s * 0.65, y + s * 0.08, s * 0.34, s * 0.26, -0.25, 26), DK.ivory, { key: key + 'l', amt: 0.28, w: 2.5 });
  dkShape(ellipsePts(x + s * 0.65, y + s * 0.08, s * 0.34, s * 0.26, 0.25, 26), DK.ivory, { key: key + 'r', amt: 0.28, w: 2.5 });
  dkShape(ellipsePts(x, y - s * 0.22, s * 0.42, s * 0.24, 0, 22), DK.ivory, { key: key + 't', amt: 0.26, w: 2 });
}

// =====================================================================
//  Teardrop border strip — top/bottom decorative band with red dot accents
// =====================================================================
function dkBorder(y0, h, c1, c2, key) {
  key = key ?? 'bdr';
  dkShape(rrectPts(-20, y0, W + 40, h, 0), c1, { key: key + 'bg', raw: true, line: false });
  // Outer line
  ctx.strokeStyle = DK.goldD; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.rect(0, y0, W, h); ctx.stroke();
  const n = Math.floor(W / (h * 0.82)) + 1, gap = W / n;
  for (let i = 0; i < n; i++) {
    const cx = i * gap + gap / 2, cy = y0 + h / 2;
    const rx = gap * 0.30, ry = h * 0.42;
    const P = [];
    for (let j = 0; j <= 30; j++) {
      const t = j / 30, a = t * TAU - Math.PI / 2;
      P.push([cx + Math.cos(a) * rx * (t < 0.5 ? 1 - t * 0.45 : 1),
              cy + Math.sin(a) * ry]);
    }
    dkShape(P, c2, { key: key + 't' + i, amt: 0.16, w: 1.8 });
    // Red dot inside each teardrop
    ctx.fillStyle = DK.red;
    ctx.beginPath(); ctx.arc(cx, cy - ry * 0.12, ry * 0.2, 0, TAU); ctx.fill();
  }
}

// =====================================================================
//  Caption + year tag (drawn after camera via DEFER)
// =====================================================================
function dkCaption(str) {
  const f = () => {
    const size = 52;
    ctx.save(); ctx.font = `500 ${size}px ${HAND}`;
    const tw = ctx.measureText(str).width;
    ctx.restore();
    const pad = 28, bw = tw + pad * 2, bh = size * 1.5;
    const x0 = CX - bw / 2, y0 = H - SAFE.bottom - 90;
    ctx.save();
    ctx.shadowColor = 'rgba(180,130,20,0.35)';
    ctx.shadowBlur = 20;
    dkShape(rrectPts(x0, y0, bw, bh, 10), DK.parchL, { key: 'cap' + str, raw: true, w: 2.5, line: DK.goldD });
    ctx.restore();
    ctx.save(); ctx.font = `500 ${size}px ${HAND}`; ctx.fillStyle = DK.ink;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fr = ev(E0 + 0.4, 0.5);
    if (fr < 1) { ctx.beginPath(); ctx.rect(x0, y0, bw * fr, bh); ctx.clip(); }
    ctx.fillText(str, CX, y0 + bh / 2);
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}

function dkYearTag(str) {
  const f = () => {
    const size = 68;
    ctx.save(); ctx.font = `600 ${size}px ${HAND}`;
    const tw = ctx.measureText(str).width;
    ctx.restore();
    const pad = 24, bw = tw + pad * 2 + 60, bh = size * 1.45;
    const x0 = 56, y0 = SAFE.top + 56;
    ctx.save();
    ctx.shadowColor = 'rgba(180,130,20,0.35)';
    ctx.shadowBlur = 16;
    dkShape(rrectPts(x0, y0, bw, bh, 10), DK.parchL, { key: 'yt' + str, raw: true, w: 3, line: DK.gold });
    ctx.restore();
    dkLotus(x0 + bw + 34, y0 + bh / 2, 22, { key: 'ytl' + str, n: 5, open: popS(E0 + 0.1), c: DK.red, ci: DK.redL });
    ctx.save(); ctx.font = `600 ${size}px ${HAND}`; ctx.fillStyle = DK.ink;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x0 + pad, y0 + bh / 2);
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}

// =====================================================================
//  Hero — blooming lotus with gentle idle bob; sets SPARK_AT
// =====================================================================
function dkHero(x, y, r, o) {
  o = o ?? {};
  y += Math.sin(TT * TAU * 0.7 + ((o.key ?? 'h').length)) * r * 0.05;
  SPARK_AT = toScreen(x, y);
  if (o.stem !== false) {
    const P = [[x, y + r * 0.9], [x - r * 0.12, y + r * 1.55], [x + r * 0.06, y + r * 2.3]];
    ink(P, { w: Math.max(4, r * 0.09), color: DK.green, key: (o.key ?? 'h') + 'st' });
  }
  dkLotus(x, y, r, { key: o.key ?? 'hero', open: o.open ?? 1, n: 12, c: o.c ?? DK.red, ci: o.ci ?? DK.redL });
  if ((o.open ?? 1) > 0.5) {
    ctx.save();
    ctx.globalAlpha = ((o.open ?? 1) - 0.5) * 0.18;
    dkShape(ellipsePts(x, y, r * 1.4, r * 1.4, 0, 36), DK.goldL, { key: (o.key ?? 'h') + 'aur', line: false, raw: true });
    ctx.restore();
  }
}

// =====================================================================
//  STYLE hooks (kit/morph.js contract)
// =====================================================================
const STYLE = {
  name: 'devakala',
  paper: DK.paper,

  backdrop(c) {
    ctx.fillStyle = c;
    ctx.fillRect(0, 0, W, H);
  },

  window(P, key, src) {
    ctx.save(); trace(P, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    ctx.save(); trace(P, true); ctx.lineWidth = 9; ctx.strokeStyle = DK.gold; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
    ctx.save(); trace(P, true); ctx.lineWidth = 3.5; ctx.strokeStyle = DK.goldD; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
  },

  blob(P, c, key) { dkShape(P, c, { key, amt: 0.45 }); },
  hero(x, y, r, o) { dkHero(x, y, r * 0.65, { ...(o ?? {}), stem: false }); },
  heroColor: DK.red,
  post() {},
  ones: false,
};

  ctx.fillRect(0, 0, W, H);

      ctx.shadowColor = 'rgba(240,230,200,0.85)';
      ctx.shadowBlur = 14;
    }
    ctx.fillStyle = `rgba(240,230,200,${isGlow ? 0.92 : 0.55})`;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
    ctx.restore();

  // 4. Cosmic bridge disc (behind lotus, centred upper third)

  // 9. Reclining divine body — smooth horizontal ellipse

// =====================================================================
//  ERAS, CAMERAS, BRIDGES
//  The bridge: a large circular disc (the cosmic moon, top of era 1)
//  morphs into the golden halo circle (top of era 2).
//  Both are centred at (540, 480) — upper-third of the 9:16 frame.
// =====================================================================
const ERA_BG = [DK.cosmic, DK.parchment];
function pieceCam(era, t) { return null; }
const BRIDGES = [
  {
    tc: 4.0,
    A: () => ({ P: ellipsePts(540, 480, 160, 160, 0, 64), c: DK.ivory }),    // cosmic disc
    B: () => ({ P: ellipsePts(540, 480, 200, 200, 0, 64), c: DK.gold }),     // halo
  },
];

// =====================================================================
//  kit/morph.js — the renderer for pieces built from ERAS (scenes) joined by SHAPE MORPHS.
//
//  At each bridge time tc:
//    shrink [tc-d, tc-m]      the old era is seen through a window shaped like the bridge object (STYLE.window),
//                             shrinking onto the object while the backdrop fades to blank paper
//    morph  [tc-m, tc+m]      on blank paper, the object's outline blends into its counterpart's
//                             (both resampled by angle around their centroids; colour lerped). Hero-to-hero
//                             bridges draw the hero itself with blended position, size and ray count.
//    grow   [tc+m, tc+d]      the new era opens out of a window shaped like the counterpart
//    d = the bridge's half-length (default 0.6s, so a bridge costs 1.2s), m = the morph's half (default 0.2s, or d/3 when d is set).
//    Short pieces: { tc, d: 0.4 } (0.8s) or fewer bridges — see craft.md -> Transitions.
//  Era boundaries WITHOUT a bridge are hard cuts (keep at most one: the slam).
//
//  The piece defines (in its head / src):
//    ERA_LIST = [[t0, t1, () => drawScene()], ...]      scenes draw in world coords, call yearTag()/capStrip()
//    ERA_BG   = ['#hex', ...]                          each era's dominant colour (for the fade to paper)
//    BRIDGES  = [{ tc, A: () => shape, B: () => shape, d?, m? }]   shape = { P: points, c: '#hex' } or SP(x, y, r, rays)
//    function pieceCam(era, t) { return null | CAM }   optional; use push() / bump() below
//  Shapes are in each era's world coords; the bridge object must be in frame at tc (pull push-ins back first).
//  The look comes from the style kit's STYLE hooks (paper, backdrop, window, blob, hero, post, ones):
//  this file draws nothing itself, so the same piece structure works in any style.
// =====================================================================
// ---- cameras: CAM = { z, tx, ty }; camOf({ z, p, to }) puts world point p on screen point to
const CAM0 = { z: 1, tx: 0, ty: 0 };
const camOf = (c) => ({ z: c.z, tx: c.to[0] - c.z * c.p[0], ty: c.to[1] - c.z * c.p[1] });
const camMix = (a, b, u) => ({ z: lerp(a.z, b.z, u), tx: lerp(a.tx, b.tx, u), ty: lerp(a.ty, b.ty, u) });
// an eased push-in over [a, b] to cam, optionally pulled back over [oa, ob]
function push(t, a, b, cam, oa, ob) { let u = EZ.io(seg(t, a, b)); if (oa != null) u *= 1 - EZ.io(seg(t, oa, ob)); return u > 0 ? camMix(CAM0, camOf(cam), u) : null; }
// a zoom bump on every beat from t0, centred on point p (the hero keeps its screen spot)
function bump(t, t0, p, amt = 0.3, every = 0.5) { return camOf({ z: 1 + amt * Math.exp(-mod(t - t0, every) * 7), p, to: p }); }
function camAt(era, t) { return (typeof pieceCam === 'function' && pieceCam(era, t)) || CAM0; }
const camPts = (P, c) => P.map(([x, y]) => [c.z * x + c.tx, c.z * y + c.ty]);
// ---- bridge shapes
function starPts(x, y, r, n, r0 = -Math.PI / 2, m = 96) {
  const P = []; for (let i = 0; i < m; i++) { const a = i / m * TAU, k = 0.42 + 0.58 * (0.5 + 0.5 * Math.cos(n * (a - r0))) ** 3; P.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  return P;
}
const SP = (x, y, r, n) => ({ spark: [x, y, r, n] });
const shapeOf = (s) => (s.spark ? { P: (STYLE.heroPts || starPts)(...s.spark), c: STYLE.heroColor, spark: s.spark } : s);
function byAngle(P, m = 96) {   // resample a closed outline to m points by angle around its centroid
  const c = P.reduce((a, p) => [a[0] + p[0] / P.length, a[1] + p[1] / P.length], [0, 0]), Q = resample(P, true, 4), out = [];
  for (let i = 0; i < m; i++) {
    const a = -Math.PI + i / m * TAU; let best = null, bd = 1e9;
    for (const q of Q) { let d = Math.atan2(q[1] - c[1], q[0] - c[0]) - a; d = Math.abs(Math.atan2(Math.sin(d), Math.cos(d))); const r = Math.hypot(q[0] - c[0], q[1] - c[1]); if (d < bd - 1e-4 || (Math.abs(d - bd) < 1e-4 && r > best[2])) { bd = d; best = [q[0], q[1], r]; } }
    out.push([best[0], best[1]]);

}
const mixHex = (a, b, u) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], u))).join(',')})`; };
function maskK(P) {   // how far the window must scale about its centroid to cover the frame
  const c = P.reduce((a, p) => [a[0] + p[0] / P.length, a[1] + p[1] / P.length], [0, 0]);
  const rmin = Math.max(8, Math.min(...byAngle(P, 48).P.map((p) => Math.hypot(p[0] - c[0], p[1] - c[1]))));
  const far = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map((q) => Math.hypot(q[0] - c[0], q[1] - c[1])));
  return { c, kmax: far / rmin * 1.1 };
}
const scaled = (P, c, k) => P.map(([x, y]) => [c[0] + (x - c[0]) * k, c[1] + (y - c[1]) * k]);
// ---- layers and windows
const LAYER = [];
function layer(i) { if (!LAYER[i]) { const c = document.createElement('canvas'); c.width = W; c.height = H; LAYER[i] = c; } return LAYER[i]; }
function renderEra(e, target) {   // draws era e into target; returns its overlay queue (year tag, caption)
  const saved = ctx; ctx = target.getContext('2d');
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.setLineDash([]);
  ctx.fillStyle = STYLE.paper; ctx.fillRect(0, 0, W, H);   // a clean sheet every frame: nothing carries over between frames
  const cam = camAt(e, TT); ctx.setTransform(cam.z, 0, 0, cam.z, cam.tx, cam.ty);

}
function flush(q, e) { const keep = E0; E0 = ERA_LIST[e][0]; ctx.setTransform(1, 0, 0, 1, 0, 0); q.forEach((f) => f()); E0 = keep; }
function shotAtFrame(fr) {
  for (const s of TIMELINE.shots) if (fr >= Math.round(s.t0 * FPS) && fr < Math.round(s.t1 * FPS)) return s;
  return TIMELINE.shots[TIMELINE.shots.length - 1];
}
const eraAt = (t) => ERA_LIST.findIndex(([a, b]) => t >= a - 1e-6 && t < b - 1e-6);
// renderFrame(t, canvas, sub): sub = true draws the exact time t between frames (motion blur sub-frames, styles on 1s)
function renderFrame(t, canvas, sub) {
  const cv = canvas || document.getElementById('c');
  ctx = cv.getContext('2d');
  F = ((Math.floor(sub ? t * FPS + 1e-6 : Math.round(t * FPS)) % NFRAMES) + NFRAMES) % NFRAMES;
  B = Math.floor(F / 2);
  TT = (STYLE.ones ? (sub ? F + (t * FPS - Math.floor(t * FPS + 1e-6)) : F) : B * 2) / FPS;
  // the era is picked by the real frame, so a cut on an odd frame (a 16th at 24fps) lands on that frame;
  // on its first frame the new era is drawn at its own start time (motion stays on 2s inside it)
  const s = shotAtFrame(F), e = Math.max(0, eraAt(F / FPS));
  E0 = ERA_LIST[e][0];
  if (TT < E0 - 1e-6) TT = E0;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.setLineDash([]); ctx.filter = 'none';
  SPARK_AT = null;
  const bd = (r) => r.d ?? 0.6, bm = (r) => r.m ?? (r.d != null ? r.d / 3 : 0.2);
  const tr = BRIDGES.find((r) => TT >= r.tc - bd(r) - 1e-6 && TT < r.tc + bd(r) - 1e-6);
  if (!tr) {
    const q = renderEra(e, layer(0)); ctx.drawImage(layer(0), 0, 0); flush(q, e);
  } else {
    const ea = eraAt(tr.tc - 0.01), eb = eraAt(tr.tc + 0.01);
    const sa = shapeOf(tr.A()), sb = shapeOf(tr.B());
    const PA = camPts(sa.P, camAt(ea, TT)), PB = camPts(sb.P, camAt(eb, TT));
    const D = bd(tr), M = bm(tr);
    if (TT < tr.tc - M) {
      const u = EZ.i2(seg(TT, tr.tc - D, tr.tc - M)), { c, kmax } = maskK(PA), k = Math.exp(lerp(Math.log(kmax), 0, u));
      STYLE.backdrop(mixHex(ERA_BG[ea], STYLE.paper, 0.5 + u * 0.5), { eraA: ea, eraB: eb, u, phase: 'shrink' });
      const q = renderEra(ea, layer(0));
      STYLE.window(scaled(PA, c, k), 'mA' + tr.tc, layer(0), { c: sa.c, u, phase: 'shrink', eraA: ea, eraB: eb });
      flush(q, ea);
    } else if (TT < tr.tc + M) {
      const u = EZ.io(seg(TT, tr.tc - M, tr.tc + M));
      STYLE.backdrop(STYLE.paper, { eraA: ea, eraB: eb, u, phase: 'morph' });
      if (sa.spark && sb.spark) {
        const ca = camAt(ea, TT), cb = camAt(eb, TT), [ax, ay] = camPts([sa.spark.slice(0, 2)], ca)[0], [bx, by] = camPts([sb.spark.slice(0, 2)], cb)[0];
        STYLE.hero(lerp(ax, bx, u), lerp(ay, by, u), lerp(sa.spark[2] * ca.z, sb.spark[2] * cb.z, u), { rays: Math.round(lerp(sa.spark[3], sb.spark[3], u)), mood: 'wow', key: 'morphspark' });
      } else {
        const A2 = byAngle(PA), B2 = byAngle(PB), M = A2.P.map((p, i) => [lerp(p[0], B2.P[i][0], u), lerp(p[1], B2.P[i][1], u)]);
        STYLE.blob(M, mixHex(sa.c, sb.c, u), 'morph' + tr.tc, u, { eraA: ea, eraB: eb, phase: 'morph' });
        if (sb.spark && u > 0.6) STYLE.hero(...camPts([sb.spark.slice(0, 2)], camAt(eb, TT))[0], sb.spark[2] * clamp((u - 0.6) / 0.4), { rays: sb.spark[3], mood: 'wow', key: 'morphspark2' });
      }
    } else {
      const u = EZ.o2(seg(TT, tr.tc + M, tr.tc + D)), { c, kmax } = maskK(PB), k = Math.exp(lerp(0, Math.log(kmax), u));
      STYLE.backdrop(mixHex(STYLE.paper, ERA_BG[eb], u * 0.5), { eraA: ea, eraB: eb, u, phase: 'grow' });
      const q = renderEra(eb, layer(0));
      STYLE.window(scaled(PB, c, k), 'mB' + tr.tc, layer(0), { c: sb.c, u, phase: 'grow', eraA: ea, eraB: eb });
      flush(q, eb);

}
window.renderFrame = renderFrame;
window.anchorAt = () => (SPARK_AT ? { x: SPARK_AT[0], y: SPARK_AT[1] } : null);

// =====================================================================
//  kit/board.js — the storyboard: every beat in TIMELINE.board drawn as a 9:16 key frame with its notes.
//  The panels ARE the piece: each one is renderFrame(t) at the beat's key time, so an approved board
//  carries straight into the video.  TIMELINE.board = [{ t, title, sound, next }]
//  Render: node tools/storyboard.mjs <piece dir> [out.png] [panel numbers...]
// =====================================================================
